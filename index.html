        // zigzag function (first thing i made for this game believe it or not)
        function zigzag(a, b, c, d, per, ang) {
          var n = dist(a, b, c, d) / per;
          var angle = atan2(d - b, c - a);
          for (var i = 0; i < n - 1; i++) {
            var t = (per * i);
            var tNext = (per * (i + 1));
            var tHalf = (t + tNext) / 2;
            var tD = ((tNext - t) / 2) / cos(ang);
            pushStyle();
            noStroke();
            triangle(a + cos(angle) * t, b + sin(angle) * t, a + cos(angle) * t + cos(ang) * tD, b + sin(angle) * t + sin(ang) * tD, a + cos(angle) * tNext, b + sin(angle) * tNext);
            popStyle();
            line(a + cos(angle) * t, b + sin(angle) * t, a + cos(angle) * t + cos(ang) * tD, b + sin(angle) * t + sin(ang) * tD);
            line(a + cos(angle) * t + cos(ang) * tD, b + sin(angle) * t + sin(ang) * tD, a + cos(angle) * tNext, b + sin(angle) * tNext);

          }
        }

        // bob lyon for the below 2 functions (edited by me to fit the game tho)
        function nearestOnLine(ax, ay, bx, by) {
          var dx = bx - ax; /* Vector from A to B (run) */
          var dy = by - ay; /* ... (rise) */
          var mag2 = dx * dx + dy * dy; /* Squared distance between A and B */

          /* Find and return the nearest point on line AB to point P. */
          var nearest = function(px, py) {
            var a2pX = px - ax; /* Vector from A to P */
            var a2pY = py - ay;
            var a2pDota2b = a2pX * dx + a2pY * dy; /* AP ⦁ AB */
            var t = a2pDota2b / mag2; /* Parametric distance from A to THE point */
            var ret = {
              x: ax + dx * t,
              y: ay + dy * t
            };

            if (between(ret.x, ax, bx) && between(ret.y, ay, by)) {
              return ret;
            } else {
              if (ret.x > ax && ret.x > bx) {
                return {
                  x: ax,
                  y: ay,
                };
              } else if (ret.x < ax && ret.x < bx) {
                return {
                  x: ax,
                  y: ay,
                };
              } else if (ret.y > ay && ret.y > by) {
                return {
                  x: ax,
                  y: ay,
                };
              } else if (ret.y < ay && ret.y < by) {
                return {
                  x: ax,
                  y: ay,
                };
              } else {
                return {
                  x: Infinity,
                  y: Infinity,
                };
              }
            }


          };

          return nearest;
        }

          if (!chunk[y]) {

          if (!chunk[y][x]) {
            chunk[y][x] = [];
          }
          if (!chunk[y][x].includes(e)) {
            chunk[y][x].push(e);
            if (!e.chunksIn) {

          if (chunk[a.y]) {

            }
          }
          return [];

        function getBetween(x, y, x2, y2) {

        // how far something can see in a direction
        var getDistance = function(x, y, a, incr, grassDoesHide, isLazer) {
          // will change once walls are incorperated
          var ret = 0;
          var inc = incr || 20;
          var max = 2000;
          for (var i = 0; i < max; i += inc) {
            ret = i;
            var xt = x + cos(a) * i;
            var yt = y + sin(a) * i;
            var test = toRenderAt(xt, yt, chunks, chunkSize);
            // stroke(255, 0, 0);
            // strokeWeight(4);
            // point(xt,yt);
            if (test.length > 0) {
              var d = false;
              //println(test.length);
              // if(grassDoesHide){
              // println('e');
              // }
              //println(isLazer);
              for (var q = 0; q < test.length; q++) {
                if (!(test[q].data.noLazerCollide === true && isLazer)) {
                  if (((!test[q].data.noShadow) || grassDoesHide)) {
                    if (xt >= test[q].x && xt <= test[q].x + test[q].w && yt >= test[q].y && yt <= test[q].y + test[q].h) {
                      d = true;
                      if (test[q].checkColl({
                          x: x,
                          y: y
                        }) && test[q].data.noCollide) {
                        d = false;
                      }
                    }
                  }
                }
              }
              if (d === true) {
                break;
              }
            }
          }
          if (ret > max) {
            ret = max;
          }
          return ret;
        };

        function projectBeam(e) {

            x1: e.x + cos(angle) * 40,
            y1: e.y + sin(angle) * 40,
            x2: e.x + cos(angle) * d,
            y2: e.y + sin(angle) * d
          };
          lazerProjections.push({
            x1: a.x1,
            y1: a.y1,
            x2: a.x2,
            y2: a.y2,
            find: nearestOnLine(a.x1, a.y1, a.x2, a.y2),

        // if a point can be seen from another point
        function canSee(a, b, c, d, grassDoesHide) {
          if (abs(a - c) <= 320 && abs(b - d) <= 320) {
            var angle = atan2(d - b, c - a);
            var d2 = dist(a, b, c, d);
            if (d2 <= getDistance(a, b, angle, 10, grassDoesHide)) {
              return true;
            }
          }
          return false;
        }

        fruit.prototype.move = function() {
          if (dist(this.x, this.y, this.target.x, this.target.y) >= 15 && this.noMove <= 0) {
            var angle = atan2(this.target.y - this.y, this.target.x - this.x);
            this.vx = lerp(this.vx, cos(angle) * 4, 0.1);
            this.vy = lerp(this.vy, sin(angle) * 4, 0.1);
            if (this.vx < 0) {
              this.toDir = 1;
            } else {
              this.toDir = -1;
            }
            this.activeMoving = true;
          }
        };
        fruit.prototype.bop = function() {
          if (this.noMove <= 0) {
            tryShake(this.x, this.y, 1);
            this.noMove = 40;
            this.clawSpin = 270 + 180;
            this.onSpinDir = this.toDir;
            this.totBops ++;
          }
        };
        fruit.prototype.lazer = function() {
          if (this.noMove <= 0 && !this.prepLazer) {
            this.noMove = lazerWait;
            this.prepLazer = true;
            this.point = this.target;
            var e = new effect(this.target.x, this.target.y, 'target', 255 / lazerWait, function(e) {
              e.pulse = 180 + sin(frameCount * 15) * 75;
              if (e.owner.toRemove) {
                this.life = 0;
              }
            });
            e.rot = atan2(this.point.y - this.y, this.point.x - this.x);
            e.owner = this;
            this.anim = 'lazer';
          }

        fruit.prototype.physics = function() {

            if (this.anim !== 'lazer') {
              this.anim = 'move';

          }

        fruit.prototype.doCollisions = function() {

        };

        // a lot of pain went into this function
        // ugly code but it works awesome
        fruit.prototype.doAi = function() {

          var noTryMove = false;
          this.hidden = false;
          if (!this.forgetTimer) {
            this.forgetTimer = 0;
          }
          if (!this.forgetHideTimer) {
            this.forgetHideTimer = 0;
          }
          if (!this.drift) {
            this.drift = 0;
            this.driftV = 0;
          }
          // finding player targets
          if (this.forgetTimer <= 0 || this.lookForNew) {
            if (round(random(0, 2)) === 2 || this.lookForNew) {
              for (var i = 0; i < fruits.length; i++) {
                if (fruits[i] !== this) {
                  if (this.lookForNew || round(random(0, (log(dist(this.x, this.y, fruits[i].x, fruits[i].y) / 1000) + 3) * 15)) <= 2) {
                    if (canSee(this.x, this.y, fruits[i].x, fruits[i].y, true)) {
                      this.targetP = fruits[i];
                      this.aX = fruits[i].x;
                      this.aY = fruits[i].y;
                      this.aVX = fruits[i].vx;
                      this.aVY = fruits[i].vy;
                    }
                  }
                }
              }
            }
          } else {
            this.forgetTimer--;
          }
          this.forgetHideTimer--;

          this.lookForNew = false;

          // if it has a player target
          if (this.targetP) {
            if (this.targetP.player) {
              // give bots drift and more realistic look
              if (round(random(0, 60)) === 5) {
                this.drift = 0;
                this.driftV = random(-4,4);
              }
              this.drift += this.driftV;
              this.target = {
                x: this.aX,
                y: this.aY
              };
              // if it can actually see the player target and isn't jsut walking towards assumed position
              if (canSee(this.x, this.y, this.targetP.x, this.targetP.y)) {
                // update assumed position
                this.aX = this.targetP.x;
                this.aY = this.targetP.y;
                this.aVX = this.targetP.vx;
                this.aVY = this.targetP.vy;
                this.target = {
                  x: this.aX,
                  y: this.aY
                };
                var a = atan2(this.target.y - this.y, this.target.x - this.x);
                var num = 0;
                if(this.playstyle.dirMod){
                num = this.playstyle.dirMod;
                }
                this.target = {
                  x: this.x + cos(a + this.drift+(180*num)) * 50,
                  y: this.y + sin(a + this.drift+(180*num)) * 50,
                };
                // fight
                var d = dist(this.x, this.y, this.aX, this.aY);
                var v = sqrt(pow(this.vx, 2) + pow(this.vy, 2));
                if (d < 30 + random(0, this.playstyle.bopAggro) / 4 + 15 * v) {
                  this.bop();
                } else if (d > 200 + random(-this.playstyle.lazerAggro,this.playstyle.lazerAggro)) {
                  if (round(random(0, 60)) === 2) {
                    var num = random(0, lazerWait);
                    this.target = {
                      x: this.aX + this.aVX * num,
                      y: this.aY + this.aVY * num
                    };
                    this.lazer();
                  }
                } else {
                  this.target = {
                    x: this.aX,
                    y: this.aY
                  };
                }

              }



              if ((dist(this.x, this.y, this.aX, this.aY) <= 20 && !(this.aX === this.targetP.x && this.aY === this.targetP.y)) || this.colCount > 60 || this.targetP.toRemove) {
                // forget
                this.targetP = false;
                this.forgetTimer = 30;
                this.colCount = 0;
                if (this.targetP.toRemove) {
                  this.lookForNew = true;
                }
                //println(this.colCount);
              }

            }
          } else if (this.targetH) {

            // if it has some hiding place as a target

            var center = {
              x: this.targetH.x + this.targetH.w / 2,
              y: this.targetH.y + this.targetH.h / 2
            };
            if (this.targetH.checkColl(this)) {
              this.hidden = true;
            }

            // high alert
            this.lookForNew = true;

            if (dist(this.x, this.y, center.x, center.y) > 5) {
              this.target = center;
              var a = atan2(this.target.y - this.y, this.target.x - this.x);
              this.target = {
                x: this.x + cos(a) * 50,
                y: this.y + sin(a) * 50
              };
            } else {
              noTryMove = true;
              if (round(random(0, this.playstyle.bushStay)) === 2) {
                this.forgetHideTimer = 300;
                this.targetH = false;
                this.lookForNew = true;
              }
            }
            if (this.colCount > 60) {
              this.forgetHideTimer = 300;
              this.targetH = false;
              this.lookForNew = true;
            }

          } else {

            // if it doesn't have a target
            // wander I guess?

            if (round(random(0, 80)) === 5) {
              this.drift = random(0, 360);
              this.driftV = random(-3, 3);
            }
            // give bots drift and more realistic look
            this.drift += this.driftV;
            this.target = {
              x: this.x + cos(this.drift) * 50,
              y: this.y + sin(this.drift) * 50
            };
            // look for hiding every now and then
            if (round(random(0, this.playstyle.bushLook)) === 2 && this.forgetHideTimer <= 0) {
              var todo = fatRenderAt(400 / chunkSizeIMG, this.x, this.y, chunksIMG, chunkSizeIMG);

        wall.prototype.checkColl = function(fruit) {
          return circleRectCollide(fruit.x, fruit.y, 40, this.x, this.y, this.w, this.h);
        };
        wall.prototype.collide = function(fruit) {
          if (!this.data.noCollide) {
            if (this.checkColl(fruit)) {
              // Placeholder text
              // text("Colliding", fruit.x, fruit.y - 50);

              // for ai
              if (fruit.colCount < 65) {
                fruit.colCount += 2;
              }

              // If the fruit's x is in between the wall's x coordinates, then we can assume it's touching a horizontal edge.
              if (fruit.x > this.x && fruit.x < this.x + this.w) {
                if (fruit.y > this.y + this.h / 2) {
                  fruit.y = this.y + this.h + 20;
                } else {
                  fruit.y = this.y - 20;
                }
                fruit.vy = 0;
                return;
              }
              // If the fruit's y is in between the wall's y coordinates, then we can assume it's touching a vertical edge.
              if (fruit.y > this.y && fruit.y < this.y + this.h) {
                if (fruit.x > this.x + this.w / 2) {
                  fruit.x = this.x + this.w + 20;
                } else {
                  fruit.x = this.x - 20;
                }
                fruit.vx = 0;
                return;
              }

              // There are still some edge cases (or I guess "corner cases") which we have to sort out.

              if (fruit.x < this.x + this.w / 2) {
                // Bottom left corner
                if (fruit.y > this.y + this.h / 2) {
                  //text("Colliding 2", fruit.x, fruit.y - 50);
                  var ang = atan2(this.y + this.h - fruit.y, this.x - fruit.x);
                  fruit.x = this.x - cos(ang) * 20;
                  fruit.y = this.y + this.h - sin(ang) * 20;
                }

                // Top left corner
                if (fruit.y < this.y + this.h / 2) {
                  //text("Colliding 2", fruit.x, fruit.y - 50);
                  var ang = atan2(this.y - fruit.y, this.x - fruit.x);
                  fruit.x = this.x - cos(ang) * 20;
                  fruit.y = this.y - sin(ang) * 20;
                }
              }

              if (fruit.x > this.x + this.w / 2) {
                // Bottom right corner
                if (fruit.y > this.y + this.h / 2) {
                  //text("Colliding 2", fruit.x, fruit.y - 50);
                  var ang = atan2(this.y + this.h - fruit.y, this.x + this.w - fruit.x);
                  fruit.x = this.x + this.w - cos(ang) * 20;
                  fruit.y = this.y + this.h - sin(ang) * 20;
                }

                // Top right corner
                if (fruit.y < this.y + this.h / 2) {
                  //text("Colliding 2", fruit.x, fruit.y - 50);
                  var ang = atan2(this.y - fruit.y, this.x + this.w - fruit.x);
                  fruit.x = this.x + this.w - cos(ang) * 20;
                  fruit.y = this.y - sin(ang) * 20;
                }
              }
            }
          }
        };
        wall.prototype.shadow = function(fruit) {
          if (!this.data.noShadow) {
            var points = [{
                x: this.x,
                y: this.y
              },
              {
                x: this.x + this.w,
                y: this.y
              },

                x: this.x + this.w,
                y: this.y + this.h
              },

                x: this.x,
                y: this.y + this.h
              },
            ];
            noStroke();
            fill(0, 0, 0);
            var extreme = 10000;
            for (var i = 0; i < points.length; i++) {
              var dir = atan2(points[i].y - fruit.y, points[i].x - fruit.x);
              var dir2;
              if (points[i + 1]) {
                dir2 = atan2(points[i + 1].y - fruit.y, points[i + 1].x - fruit.x);
              } else {
                dir2 = atan2(points[0].y - fruit.y, points[0].x - fruit.x);
              }
              beginShape();
              vertex(points[i].x, points[i].y);
              vertex(points[i].x + cos(dir) * extreme, points[i].y + sin(dir) * extreme);
              if (points[i + 1]) {
                vertex(points[i + 1].x + cos(dir2) * extreme, points[i + 1].y + sin(dir2) * extreme);
                vertex(points[i + 1].x, points[i + 1].y);
              } else {
                vertex(points[0].x + cos(dir2) * extreme, points[0].y + sin(dir2) * extreme);
                vertex(points[0].x, points[0].y);
              }
              endShape(CLOSE);
            }
          }

              var num = 20;
              image(coolBg,-100+((-(menuBgScroll.x-300))/300)*50+cos(frameCount)*num,-100+((-(menuBgScroll.y-300))/300)*50+sin(frameCount)*num,800,800);

              for(var i = 320; i > 200; i-=5){
                noStroke();
                fill(0,0,0,10);
                rect(-10,170-i/2,620,i);
              }
              logo(300,300);

              p.x = 150;
              p.y = 400;
              p.toDir = -1;
              pushMatrix();
              translate(p.x,p.y);
              scale(2);
              translate(-p.x,-p.y);
              p.anim = 'idle';
              p.noMove = 0;
              p.clawSpin = 90;
              p.draw();
              popMatrix();
              stroke(0,0,0);
              strokeWeight(5);
              textSize(20);
                  button(240, 450, 35, 35, ">", color(119-50, 242-50, 145-50),color(0,0,0),function() {
                    if(p.skin <= 2){
                        p.skin++;
                    }
                    p.skin = round(p.skin);
                  });
                  button(25, 450, 35, 35, "<", color(119-50, 242-50, 145-50),color(0,0,0),function() {
                    if(p.skin >= 1){
                        p.skin--;
                    }
                    p.skin = round(p.skin);
                  });
                  button(350, 350, 200, 35, "Tutorial", color(119-50, 242-50, 145-50),color(0,0,0),function() {
                    scene = 'tutorial';
                    tutorialPage = 0;
                  });
                  button(350, 400, 200, 35, "Play", color(150,40,40),color(0,0,0),function() {
                    scene = 'mapSelect';

                  });
                  button(350, 450, 200, 35, "Settings", color(119-50, 242-50, 145-50),color(0,0,0),function() {
                    scene = 'settings';

                  });
              stroke(0,0,0);
              strokeWeight(5);
              textSize(20);
              if(msX > 160 && msX < 440 && msY > 525 && msY < 565){
              fill(214, 214, 214);
              cursor('text');
              if(pushedKey){
                  var allowed = 'qwertyuiopasdfghjklzxcvbnmQWERTYUIOPASDFGHJKLZXCVBNMM1234567890!@#$%^&*(),./;\'[]<>?:"{}|-=_+`~';
                  if(parseInt(pushedKey,1) === 8){
                  p.name = p.name.substring(0,p.name.length-1);
                  }else if(allowed.includes(pushedKey.toString())){
                  if(textWidth(p.name) < 200){
                  p.name += pushedKey.toString();
                  }
                  }
              }
              }else{
              fill(171, 171, 171);
              }
              rect(160,525,280,40,10);
              fill(0,0,0);
              textAlign(CENTER,BASELINE);
              text('Name: '+p.name,300,553);
              image(bgSave,-pow(newSceneCount,2),0);
              }
              break;
              case 'game': {
                syncMouse();
                pushMatrix();
                if(maps[mapSelect].bgColor){
                background(maps[mapSelect].bgColor);
                }else{
                background(115, 255, 162);
                }
                translate(300, 300);
                scale(cam.zoom);
                translate(-300, -300);
                translate(cam.x, cam.y);
                cursor(HAND);
                var camTarg;
                if(!spectating){
                camTarg = p;
                }else{
                camTarg = spectatingIndex;
                }

                if(camTarg){
                cam.x = lerp(cam.x, -camTarg.x + 300, 0.09);
                cam.y = lerp(cam.y, -camTarg.y + 300, 0.09);
                }
                cam.zoom = lerp(cam.zoom, toZoom, 0.07);

                if (CONTROLS === 'wasd') {
                  p.target = false;
                  var x = 0;
                  var y = 0;
                  // 87 65 83 68
                  if (pressed(keys[65])) {
                    x -= 50;
                  }
                  if (pressed(keys[68])) {
                    x += 50;
                  }
                  if (pressed(keys[87])) {
                    y -= 50;
                  }
                  if (pressed(keys[83])) {
                    y += 50;
                  }
                  x = round(x);
                  y = round(y);
                  if (x || y) {
                    p.target = {
                      x: p.x + x,
                      y: p.y + y
                    };
                  }
                  if (p.target) {
                    p.move();
                  }
                }

                p.target = {
                  x: cMouseX,
                  y: cMouseY
                };

                if (CONTROLS === 'w') {
                  if (pressed(keys[87])) {
                    p.move();
                  }
                }
                if (CONTROLS === 'click') {
                  if (mouseIsPressed) {
                    p.move();
                  }
                }

                if (tapped(keys[32])) {
                  p.bop();
                }
                if (tapped(keys[69])) {
                  p.lazer();
                }

                for (var i = fruits.length - 1; i > -1; i--) {
                  if (fruits[i] !== p) {
                    fruits[i].doAi();
                  }
                }
                drawWalls(-cam.x + 300, -cam.y + 300, camTarg, true);
                for (var i = fruits.length - 1; i > -1; i--) {
                  fruits[i].physics();
                  fruits[i].doCollisions();
                  fruits[i].draw();
                }
                for (var i = fruits.length - 1; i > -1; i--) {
                  if (fruits[i].toRemove) {
                    if (fruits[i] === p) {
                      gameOver = true;
                    }
                    fruits[i].remove();
                  }
                }
                lazerProjections = [];
                for (var i = fruits.length - 1; i > -1; i--) {
                  if (fruits[i].anim === 'lazer') {
                    projectBeam(fruits[i]);
                  }
                }
                for (var i = effects.length - 1; i > -1; i--) {
                  effects[i].draw();
                }
                drawWalls(-cam.x + 300, -cam.y + 300, camTarg);



                // un-chunkified (slower in most cases)
                // for(var i = walls.length-1; i > -1; i--){
                //     walls[i].shadow(p);
                // }
                // for(var i = walls.length-1; i > -1; i--){
                //     walls[i].draw();
                // }

                popMatrix();

                fill(255);
                textAlign(LEFT,BASELINE);
                textSize(20);
                text("Players left: " + fruits.length, 450, 30);
                killfeed.displayMessages();
                var txt = "Applesauced!";
                if (fruits.length === 1) {
                      if (fruits.includes(p)) {
                          txt = "You win!";
                      } else {
                          txt = fruits[0].name + " wins!";

                          // Scales down text that's too big
                          if (textWidth(txt) > 280) {
                              textSize(30*280/textWidth(txt));
                          }
                      }
                      gameOver = true;
                  }
                if(spectating){
                    fill(255);
                    textAlign(CENTER,BASELINE);
                    text("Space to change player\n\n"+spectatingIndex.name+' ('+spectatingIndex.playstyle.id+')', 300, 150);
                    if (tapped(keys[32])) {
                    spectatingIndex = fruits.indexOf(spectatingIndex);
                    spectatingIndex++;
                    shake = 6;
                    spectatingIndex = round(spectatingIndex);
                    if(spectatingIndex>=fruits.length){
                    spectatingIndex = 0;
                    }
                    spectatingIndex = fruits[spectatingIndex];
                    }
                    textSize(30);
                    stroke(0,0,0);
                    if (fruits.length === 1) {
                        spectating = false;
                        p.x = spectatingIndex.x;
                        p.y = spectatingIndex.y;
                    }
                 button(200,530, 200,50, "Leave", color(51, 143, 230), color(0,0,0),function() {
                    scene = 'menu';
                  });
                }
                if (gameOver && !spectating) {
                  cursor("default");
                  noStroke();
                  fill(0, 0, 0, min(gameOverTime * 1.5 - 150, 150));
                  rect(0, 0, width, height);
                  rect(150, 150, 300, 230);
                  fill(255, gameOverTime * 1.5 - 150);
                  textSize(30);
                  textAlign(CENTER, CENTER);
                  text(txt, 300, 180);
                  textSize(18);
                  // Old version
                //   textAlign(LEFT, TOP);
                //   text("Kills:\nBops:\nBlasts:\nBop accuracy:\nBlast accuracy:\nTotal accuracy:", 180, 200, 300, 180);
                //   textAlign(RIGHT, TOP);
                //   text((p.bops + p.blasts) + "\n" + p.bops + "\n" + p.blasts + "\n" + ((p.bops/p.totalBops*100) || 0) + "%\n" + ((p.blasts/p.totalBlasts*100) || 0) + "%\n" + ((p.bops + p.blasts)/(p.totalBops + p.totalBlasts) || 0) + "%", 150, 200, 270, 180);
                  textAlign(CENTER, TOP);
                  text("Kills: " + (p.bops + p.blasts) + "\n" +
                  "Bops: " + p.bops + "\n" +
                  "Blasts: " + p.blasts + "\n" +
                  "Bop accuracy: " + round((p.bops/p.totBops*100) || 0) + "%\n" +
                  "Blast accuracy: " + round((p.blasts/p.totBlasts*100) || 0) + "%\n" +
                  "Total accuracy: " + round((p.bops + p.blasts)/(p.totBops + p.totBlasts)*100 || 0) + "%", 150, 200, 300, 180);
                  textSize(20);
                  if (fruits.length > 1) {
                      button(175, 400, 125, 35, "Home", color(0, 242, 24, gameOverTime * 1.5 - 150), color(255, gameOverTime * 1.5 - 150), function() {
                        scene = 'menu';
                        p.bops = 0;
                        p.blasts = 0;
                        p.totBops = 0;
                        p.totBlasts = 0;
                      });
                      button(325, 400, 100, 35, "Spectate", color(181, gameOverTime * 1.5 - 150), color(255, gameOverTime * 1.5 - 150), function() {
                        spectating = true;
                        spectatingIndex = fruits[0];
                        p.x = -100000;
                        gameOverTime = 0;
                      });
                      button(230, 450, 140, 35, "Play again", color(200, 22, 22, gameOverTime * 1.5 - 150), color(255, gameOverTime * 1.5 - 150), function() {
                        initLoading(mapSelect);
                        p.bops = 0;
                        p.blasts = 0;
                        p.totBops = 0;
                        p.totBlasts = 0;
                      });
                  } else {
                      button(155, 400, 125, 35, "Home", color(0, 242, 24, gameOverTime * 1.5 - 150), color(255, gameOverTime * 1.5 - 150), function() {
                        scene = 'menu';
                        p.bops = 0;
                        p.blasts = 0;
                        p.totBops = 0;
                        p.totBlasts = 0;
                      });
                      button(305, 400, 140, 35, "Play again", color(200, 22, 22, gameOverTime * 1.5 - 150), color(255, gameOverTime * 1.5 - 150), function() {
                        initLoading(mapSelect);
                        p.bops = 0;
                        p.blasts = 0;
                        p.totBops = 0;
                        p.totBlasts = 0;
                      });
                  }
                  gameOverTime++;
                } else {
                  // cursor(ARROW);
                }

              }
              break;
              case 'intro': {
              pushMatrix();
              scale(1.5);
              doIntro();
              popMatrix();
              }
              break;
            }
            fill(255, 0, 0);
            textSize(20);
            textAlign(LEFT, BASELINE);
            //text('Framerate: ' + round(this.__frameRate * 10) / 10, 10, 20);
            manageKeys();
          } catch (e) {
            // failsafe
            println('error: ' + e);
            println('redirecting to menu, sorry for only having two weeks to catch bugs');
            scene = 'menu';
          }

          // detect changes in scene and capture screen for epic 100% original transition
          if(previousScene !== scene){
            bgSave = get();
            previousScene = scene;
            newSceneCount = 0;
          }
          newSceneCount++;

          // some stuff that has to be reset every frame
          clicked = false;
          pushedKey = false;
        }
        var clicked = false;
        mouseClicked = function() {
          clicked = true;
        };
      </script>

    <script src="https://cdn.jsdelivr.net/gh/ackvonhuelio/chickenGameCodes/runPJS_onKA.js"></script>
        <script>
            let scaleFactor = 1;
            function resizeCanvas() {
                let canvas = document.querySelector("canvas");
                if (!canvas) return;

                scaleFactor = Math.min(window.innerWidth / 600, window.innerHeight / 700);
                canvas.style.transform =`scale(${scaleFactor})`;

                // Pass the scale factor to the PJS code
                window.scaleFactor = scaleFactor;
            }

            window.addEventListener("resize", resizeCanvas);
            window.addEventListener("load", resizeCanvas);
            window.addEventListener("orientationchange", resizeCanvas);
            let firstClick = true;

            document.addEventListener("click", function () {
                if (firstClick) {
                    setTimeout(resizeCanvas, 10);
                    firstClick = false;
                }
            });
            if (window.visualViewport) {
window.visualViewport.addEventListener("resize", resizeCanvas);
            }
        </script>
</body>
